name: Deploy to cPanel (Smart Path)

on:
  push:
    branches:
      - main # Pastikan ini sesuai dengan nama branch utama Anda (main atau master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil kode terbaru dari repositori Anda
    - name: Ambil Kode (Checkout)
      uses: actions/checkout@v3

    # 2. Siapkan Node.js versi 20 di dalam server GitHub
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    # 3. Install dan Build Aplikasi (Menyuntikkan Kunci Supabase)
    - name: Install & Build Aplikasi
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      run: |
        npm install
        npm run build

    # 4. Setelah matang, bungkus (ZIP) file yang penting saja agar transfer ke hosting cepat
    - name: Bungkus Hasil Build (ZIP)
      run: zip -r deploy.zip .next public package.json package-lock.json next.config.*

    # 5. Kirim file ZIP tersebut ke cPanel menggunakan SCP
    - name: Upload ke cPanel (SCP)
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: "deploy.zip"
        target: "/home/USERNAME_CPANEL_ANDA/cleohotels" # <--- UBAH USERNAME CPANEL ANDA DI SINI

    # 6. Masuk ke cPanel via SSH, Ekstrak, dan Restart Aplikasi
    - name: Ekstrak & Restart di cPanel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          # Masuk ke folder project
          cd /home/USERNAME_CPANEL_ANDA/cleohotels # <--- UBAH JUGA DI SINI
          
          # Ekstrak file zip yang baru datang, dan otomatis timpa file lama
          unzip -o deploy.zip
          
          # Hapus file zip-nya agar storage hosting tidak cepat penuh
          rm deploy.zip
          
          # Install HANYA library untuk produksi (sangat ringan untuk RAM cPanel)
          npm install --omit=dev
          
          # Restart aplikasi Node.js secara otomatis
          mkdir -p tmp
          touch tmp/restart.txt